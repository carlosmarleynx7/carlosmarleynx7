name: Generate snake
on:
  workflow_dispatch:
  schedule:
    - cron: '20 4 * * *'
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: carlosmarleynx7
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#83d450&color_dots=#101c13,#254831,#387e39,#61a83c,#a7dc65
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
